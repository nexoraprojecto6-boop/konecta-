name: CI - API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "prisma/**"
      - "pnpm-workspace.yaml"
      - "package.json"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "prisma/**"
      - "pnpm-workspace.yaml"
      - "package.json"

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Build dos pacotes compartilhados
        run: pnpm --filter "./packages/**" build

      - name: Gerar Prisma Client
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm --filter @konecta/api lint

      - name: Build
        run: pnpm --filter @konecta/api build
